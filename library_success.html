<!DOCTYPE html>
<html>

<head>

    <title>BookNest - Success</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='library.css') }}">

</head>

<body>

<div class="dashboard">

    <nav class="navbar">

        <div class="logo">
            📚 BookNest
        </div>

        <div class="nav-links">

            <a href="{{ url_for('library_dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('library_issue') }}">
                Issue Book
            </a>

            <a href="{{ url_for('library_books') }}">
                Books
            </a>

            <a href="{{ url_for('library_history') }}">
                History
            </a>

            <a href="{{ url_for('library_logout') }}">
                Logout
            </a>

        </div>

    </nav>


    <div class="dashboard-content">

        <div class="success-card">

            <div class="success-icon">
                ✓
            </div>


            <h1>
                Book Issued Successfully!
            </h1>


            <p>
                The book has been successfully issued
                to the student.
            </p>


            <div class="success-box">

                <p>
                    <strong>Book Name:</strong>
                    {{ book_name }}
                </p>

                <p>
                    <strong>Student Name:</strong>
                    {{ student_name }}
                </p>

                <p>
                    <strong>Issue Date:</strong>
                    {{ issue_date }}
                </p>

            </div>


            <div class="buttons">

                <a href="{{ url_for('library_dashboard') }}">

                    <button type="button">
                        🏠 Dashboard
                    </button>

                </a>


                <a href="{{ url_for('library_books') }}">

                    <button type="button">
                        📚 View Books
                    </button>

                </a>


                <a href="{{ url_for('library_issue') }}">

                    <button type="button">
                        ➕ Issue Another
                    </button>

                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
