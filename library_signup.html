<!DOCTYPE html>
<html>

<head>

    <title>BookNest - Sign Up</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='library.css') }}">

</head>

<body>

    <div class="container">

        <h1>Create Account</h1>

        <p>
            Join BookNest Library Management
        </p>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">

            <label>Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Create username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <p>

            Already have an account?

            <a href="{{ url_for('library_login') }}">
                Login
            </a>

        </p>

    </div>

</body>

</html>
